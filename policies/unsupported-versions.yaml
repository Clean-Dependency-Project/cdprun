# Unsupported runtime versions that should no longer be downloaded or distributed.
#
# Structure:
#   runtime_name:
#     - version: "<prefix>"   # prefix matching: "16" matches "16.x.y" but not "160.x.y"
#       reason: "<human-readable reason>"
#       eol_date: "<YYYY-MM-DD>"
#
# Sources: per-runtime policy files in policies/ (generated from endoflife.date)
# All entries here have supported=false in the corresponding policy JSON.
#
# Clients reading simple/.../index.json should check the "unsupported" key
# and remove or block versions listed there.

nodejs:
  # Node.js versions that have reached end-of-life per endoflife.date
  # Versions 1-3 have no known date (predates formal EOL tracking).
  - version: "1"
    reason: "EOL (no formal date)"
