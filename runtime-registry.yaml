version: "1.0"
metadata:
 name: "Runtime Download Registry"
 description: "Configuration for unified runtime download system"
config:
 download_timeout: "300s"
 auto_download_all_platforms: true  
 ignore_file: "policies/ignore-versions.yaml"
 storage:
   database_path: "./downloads.db"
 packaging_execution:
   workspace_dir: "."
   binary_path: "./bin/cdprun"
   docker_platform: "linux/amd64"
runtimes:
  python:
    enabled: false
    name: "Python"
    description: "High-level programming language"
    endoflife_product: "python"
    policy_file: "policies/python-policy.json"
    version_pattern: "major_minor"
    supported_architectures:
      - "x64"
      - "aarch64"
    supported_platforms:
      - os: "windows"
        arch: ["x64"]
        file_extension: "exe"
        download_name: "windows"
      - os: "linux"
        arch: ["x64"]
        file_extension: "tar.xz"
        download_name: "linux"
      - os: "mac"
        arch: ["x64", "aarch64"]
        file_extension: "pkg"
        download_name: "mac"
    download:
      base_url: "https://www.python.org/ftp/python"
      url_pattern: "{base_url}/{version}/python-{version}-{arch}.{ext}"
      user_agent: "cdprun/1.0 (Python)"
      requires_auth: false
    verification:
      enabled: true
      methods:
        checksum:
          enabled: false
          algorithm: "sha256"
          file_pattern: ""
          remote_checksum: false
        gpg:
          enabled: true
          signature_pattern: ".asc"
    endoflife:
      product_name: "python"
      check_eol: true
      warn_on_eol: true
    release:
      auto_release: true
      github_repository: "Clean-Dependency-Project/cdprun"
      draft_release: false
      release_name_template: "Python Runtime Binaries - {version}"
    packaging:
      enabled: false
      targets: []
      package_name_template: "OSPO-{runtime}"
      install_prefix_template: "/export/apps/citools/OSPO-{runtime}/{version}"
      execution:
        targets:
          rpm:
            build:
              image: "amazonlinux:2023"
              shell: "/bin/bash"
              script: "bash /workspace/scripts/package/python/rpm/build.sh"
            test:
              image: "amazonlinux:2023"
              shell: "/bin/bash"
              script: "bash /workspace/scripts/package/python/rpm/test.sh"
          apk:
            build:
              image: "alpine:3.19"
              shell: "/bin/sh"
              script: "sh /workspace/scripts/package/python/apk/build.sh"
            test:
              image: "alpine:3.19"
              shell: "/bin/sh"
              script: "sh /workspace/scripts/package/python/apk/test.sh"
  nodejs:
   enabled: true
   name: "Node.js"
   description: "JavaScript runtime built on Chrome's V8 JavaScript engine"
   endoflife_product: "nodejs"
   policy_file: "policies/nodejs-policy.json"
   version_pattern: "major"
   supported_architectures:
     - "x64"
     - "aarch64"
   supported_platforms:
     - os: "windows"
       arch: ["x64", "aarch64"]
       file_extension: "msi"
       download_name: "win"
     - os: "linux"
       arch: ["x64"]
       file_extension: "tar.gz"
       download_name: "linux"
     - os: "mac"
       arch: ["x64", "aarch64"]
       file_extension: "pkg"
       download_name: "darwin"
   download:
     base_url: "https://nodejs.org/dist"
     url_pattern: "{base_url}/v{version}/node-v{version}-{platform}-{arch}.{ext}"
     user_agent: "cdprun/1.0 (Node.js)"
     requires_auth: false
   verification:
     enabled: true
     methods:
       checksum:
         enabled: true
         algorithm: "sha256"
         file_pattern: "SHASUMS256.txt"
         remote_checksum: true
       gpg:
         enabled: true
         signature_pattern: "SHASUMS256.txt.asc"
   endoflife:
     product_name: "nodejs"
     check_eol: true
     warn_on_eol: true
   release:
     auto_release: true
     github_repository: "Clean-Dependency-Project/cdprun"
     draft_release: false
     release_name_template: "Node.js Runtime Binaries - {version}"
   packaging:
     enabled: true
     targets: ["rpm"]
     package_name_template: "OSPO-{runtime}"
     install_prefix_template: "/export/apps/citools/OSPO-{runtime}/{version}"
     execution:
       targets:
         rpm:
           build:
             image: "amazonlinux:2023"
             shell: "/bin/bash"
             script: "bash /workspace/scripts/package/rpm/build.sh"
           test:
             image: "amazonlinux:2023"
             shell: "/bin/bash"
             script: "bash /workspace/scripts/package/rpm/test.sh"
  temurin:
    enabled: true
    name: "Eclipse Temurin"
    description: "OpenJDK distribution from Eclipse Foundation (Adoptium)"
    endoflife_product: "temurin"  # Correct: Use "temurin" for endoflife.date API
    policy_file: "policies/temurin-policy.json"

    # Version management
    version_pattern: "major"  # Java uses major versioning (8, 11, 17, 21, etc.)
    supported_architectures:
      - "x64"
      - "aarch64"  # Add ARM64 support
    supported_platforms:
      - os: "windows"
        arch: ["x64", "aarch64"]  # Support both x64 and ARM64
        file_extension: "msi"  # MSI preferred on Windows
        download_name: "windows"
      - os: "linux"
        arch: ["x64"]  # Keep Linux as x64 only for now
        file_extension: "tar.gz"  # tar.gz for Linux
        download_name: "linux"
      - os: "mac"
        arch: ["x64", "aarch64"]  # Support both x64 and ARM64
        file_extension: "pkg"  # PKG for macOS
        download_name: "mac"

    # Download configuration - Uses Adoptium API
    download:
      base_url: "https://api.adoptium.net/v3/assets/version"
      url_pattern: "{base_url}/{version}"
      user_agent: "downloadruntime/1.0 (Temurin)"
      requires_auth: false
      disable_github_token_check: false  # Set to true to disable GitHub token warnings

    # Verification configuration
    verification:
      enabled: true
      methods:
        checksum:
          enabled: true
          algorithm: "sha256"
          file_pattern: "*.sha256.txt"
          remote_checksum: true
        gpg:
          enabled: true
          signature_pattern: "*.sig"
      audit_logging:
        enabled: true
        output_dir: "./verification-logs"
        file_pattern: "{runtime}-{version}-{timestamp}.json"

    # EndOfLife integration
    endoflife:
      product_name: "eclipse-temurin"
      check_eol: true
      warn_on_eol: true

    release:
      auto_release: true
      github_repository: "Clean-Dependency-Project/cdprun"
      draft_release: false
      release_name_template: "Temurin Runtime Binaries - {version}"

    # Nexus integration
    nexus:
      enabled: true
      path_pattern: "{os_folder}/{software_name}/{version}/{filename}" # Windows/Temurin_v21/21.0.1/filename
      # Platform-specific path patterns (optional)
      platform_patterns:
        windows: "Windows/{runtime}/v{major_version}/{version}/{filename}"  # Windows/Temurin/v21/21.0.1/filename
        linux: "Linux/{runtime}/v{major_version}/{version}/{filename}"      # Linux/Temurin/v21/21.0.1/filename
        mac: "Mac/{runtime}/v{major_version}/{version}/{filename}"          # Mac/Temurin/v21/21.0.1/filename
      upload_after_download: true                                # Upload immediately after download
      upload_after_verification: true                           # Upload after successful verification
  tomcat:
    enabled: false
    name: "Apache Tomcat"
    description: "Apache Tomcat is an open source implementation of the Java Servlet, JavaServer Pages, Java Expression Language and Java WebSocket technologies"
    endoflife_product: "tomcat"
    policy_file: "policies/tomcat-policy.json"
    version_pattern: "major_minor"
    supported_architectures:
      - "x64"
      - "x86"
    supported_platforms:
      - os: "windows"
        arch: ["x64", "x86"]
        file_extension: "zip"
        download_name: "windows"
      - os: "linux"
        arch: ["x64"]
        file_extension: "tar.gz"
        download_name: "linux"
    download:
      base_url: "https://archive.apache.org/dist/tomcat"
      url_pattern: "{base_url}/tomcat-{major}/v{version}/bin/apache-tomcat-{version}.{ext}"
      user_agent: "cdprun/1.0 (Tomcat)"
      requires_auth: false
    verification:
      enabled: true
      methods:
        checksum:
          enabled: true
          algorithm: "sha512"
          file_pattern: "{url}.sha512"
          remote_checksum: true
        gpg:
          enabled: true
          signature_pattern: ".asc"
    endoflife:
      product_name: "tomcat"
      check_eol: true
      warn_on_eol: true
    release:
      auto_release: true
      github_repository: "Clean-Dependency-Project/cdprun"
      draft_release: false
      release_name_template: "Apache Tomcat Runtime Binaries - {version}"
    packaging:
      enabled: false
      targets: []
      package_name_template: "OSPO-{runtime}"
      install_prefix_template: "/export/apps/citools/OSPO-{runtime}/{version}"
      execution:
        targets:
          rpm:
            build:
              image: "amazonlinux:2023"
              shell: "/bin/bash"
              script: "bash /workspace/scripts/package/rpm/build.sh"
            test:
              image: "amazonlinux:2023"
              shell: "/bin/bash"
              script: "bash /workspace/scripts/package/rpm/test.sh"
          apk:
            build:
              image: "alpine:3.19"
              shell: "/bin/sh"
              script: "sh /workspace/scripts/package/apk/build.sh"
            test:
              image: "alpine:3.19"
              shell: "/bin/sh"
              script: "sh /workspace/scripts/package/apk/test.sh"
  yarn:
    enabled: false
    name: "Yarn Classic"
    description: "Yarn package manager classic distribution"
    endoflife_product: "yarn"
    policy_file: "policies/yarn-policy.json"
    version_pattern: "major"
    supported_architectures:
      - "x64"
    supported_platforms:
      - os: "windows"
        arch: ["x64"]
        file_extension: "msi"
        download_name: "windows"
      - os: "linux"
        arch: ["x64"]
        file_extension: "tar.gz"
        download_name: "linux"
      - os: "mac"
        arch: ["x64"]
        file_extension: "tar.gz"
        download_name: "mac"
    download:
      base_url: "https://github.com/yarnpkg/yarn/releases/download"
      url_pattern: "{base_url}/v{version}/{filename}"
      user_agent: "cdprun/1.0 (Yarn)"
      requires_auth: false
    verification:
      enabled: true
      methods:
        checksum:
          enabled: false
          algorithm: "sha256"
          file_pattern: "{url}.sha256"
          remote_checksum: true
        gpg:
          enabled: true
          signature_pattern: ".asc"
    endoflife:
      product_name: "yarn"
      check_eol: true
      warn_on_eol: true
    release:
      auto_release: true
      github_repository: "Clean-Dependency-Project/cdprun"
      draft_release: false
      release_name_template: "Yarn Classic Runtime Binaries - {version}"
    packaging:
      enabled: false
      targets: []
      package_name_template: "OSPO-{runtime}"
      install_prefix_template: "/export/apps/citools/OSPO-{runtime}/{version}"
      execution:
        targets:
          rpm:
            build:
              image: "amazonlinux:2023"
              shell: "/bin/bash"
              script: "bash /workspace/scripts/package/rpm/build.sh"
            test:
              image: "amazonlinux:2023"
              shell: "/bin/bash"
              script: "bash /workspace/scripts/package/rpm/test.sh"
          apk:
            build:
              image: "alpine:3.19"
              shell: "/bin/sh"
              script: "sh /workspace/scripts/package/apk/build.sh"
            test:
              image: "alpine:3.19"
              shell: "/bin/sh"
              script: "sh /workspace/scripts/package/apk/test.sh"
  vscode:
    enabled: true
    name: "Visual Studio Code"
    description: "VSCode binaries for Windows and macOS"
    endoflife_product: "vscode"
    policy_file: ""
    version_pattern: "major"
    supported_architectures:
      - "x64"
      - "aarch64"
    supported_platforms:
      - os: "windows"
        arch: ["x64", "aarch64"]
        file_extension: "exe"
        download_name: "win32"
      - os: "mac"
        arch: ["x64", "aarch64"]
        file_extension: "zip"
        download_name: "darwin-universal"
    download:
      base_url: "https://update.code.visualstudio.com"
      url_pattern: ""
      user_agent: "cdprun/1.0 (VSCode)"
      requires_auth: false
    verification:
      enabled: true
      methods:
        checksum:
          enabled: true
          algorithm: "sha256"
          file_pattern: "api/update/{platform}/stable/latest.sha256hash"
          remote_checksum: true
        gpg:
          enabled: false
          signature_pattern: ""
    endoflife:
      product_name: "vscode"
      check_eol: false
      warn_on_eol: false
    release:
      auto_release: true
      github_repository: "Clean-Dependency-Project/cdprun"
      draft_release: false
      release_name_template: "VSCode Runtime Binaries - {version}"
    packaging:
      enabled: false
      targets: []

  intellij_idea_ultimate:
    enabled: true
    name: "IntelliJ IDEA Ultimate"
    description: "IntelliJ IDEA Ultimate (IIU) — versions from JetBrains releases API only; not on endoflife.date"
    endoflife_product: ""
    policy_file: ""
    version_pattern: "major"
    supported_architectures:
      - "x64"
      - "aarch64"
    supported_platforms:
      - os: "mac"
        arch: ["aarch64"]
        file_extension: "dmg"
        download_name: "macM1"
      - os: "windows"
        arch: ["aarch64"]
        file_extension: "exe"
        download_name: "windowsARM64"
      - os: "windows"
        arch: ["x64"]
        file_extension: "exe"
        download_name: "windows"
    download:
      base_url: "https://data.services.jetbrains.com/products/releases"
      jetbrains_code: "IIU"
      jetbrains_type: "release"
      url_pattern: ""
      user_agent: "cdprun/1.0 (IntelliJ)"
      requires_auth: false
    verification:
      enabled: true
      methods:
        checksum:
          enabled: true
          algorithm: "sha256"
          file_pattern: "jetbrains#checksumLink"
          remote_checksum: true
        gpg:
          enabled: false
          signature_pattern: ""
    endoflife:
      product_name: ""
      check_eol: false
      warn_on_eol: false
    release:
      auto_release: true
      github_repository: "Clean-Dependency-Project/cdprun"
      draft_release: false
      release_name_template: "IntelliJ IDEA Ultimate - {version}"
    packaging:
      enabled: false
      targets: []